services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediqueue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mediqueue_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediqueue"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env          # loads RESEND, STRIPE, JWT, VAPID from .env
    environment:
      NODE_ENV: production
      PORT: "5001"
      DATABASE_URL: postgres://postgres:mediqueue_local@postgres:5432/mediqueue
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: "https://mediqueue.monjurhossen.online"
      SEED_DEMO: "true"
      FRONTEND_URL: "https://mediqueue.monjurhossen.online"
      # DATABASE_URL here overrides the one in .env (needed to use docker service name)
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health/live 2>/dev/null | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://mediqueue-api.monjurhossen.online
        NEXT_PUBLIC_WS_URL: https://mediqueue-api.monjurhossen.online
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    name: mediqueue_postgres_data