name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # BACKEND  — type-check + build
  # Integration tests are skipped in CI (they require a live PostgreSQL + Redis).
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (type-check + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # FRONTEND  — lint + type-check + build
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      # Next.js bakes NEXT_PUBLIC_* at build time — provide dummy values for CI
      NEXT_PUBLIC_API_URL: http://localhost:5001
      NEXT_PUBLIC_WS_URL: http://localhost:5001
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build