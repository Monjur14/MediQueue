services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mediqueue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediqueue"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5001"
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: "https://mediqueue.monjurhossen.online"
      NEXT_PUBLIC_APP_URL: "https://mediqueue.monjurhossen.online"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health/live 2>/dev/null | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://mediqueue-api.monjurhossen.online
        NEXT_PUBLIC_WS_URL: https://mediqueue-api.monjurhossen.online
        NEXT_PUBLIC_APP_URL: https://mediqueue.monjurhossen.online
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
